name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

jobs:
  integration:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Test the packaged library against the live API
        run: npm run test:package:live
      - name: Run the full live integration suite
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:integration
